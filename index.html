function reply(q){q=q.toLowerCase();if(/видео|иде[яию]/.test(q))return 'Вот несколько идей для видео, которые могут тебе понравиться:\n\n1. Уютное утро в твоём стиле.\n2. Путешествие по красивым местам.\n3. Мини-история с неожиданным финалом.\n4. Город будущего на закате.\n\nКакой формат тебе ближе?';if(/привет|здравств/.test(q))return 'Привет! Рада тебя видеть ✨ Что создадим сегодня: историю, картинку или идею для видео?';if(/уч[её]б|план|работ/.test(q))return 'Попробуй такой план:\n\n1. Выбери одну главную задачу.\n2. Раздели её на три маленьких шага.\n3. Выдели 25 минут на первый шаг.\n4. Сделай перерыв и оцени результат.\n\nЭто пример ответа в деморежиме.';return 'Можно начать с небольшой творческой идеи: представь тихий город на закате, придумай героя и добавь одну неожиданную деталь.\n\nВ этом макете я показываю заранее подготовленные ответы. Попробуй написать «Придумай идею для видео» или «Помоги составить план».'}
async function submit(text){if(busy)return;if(page==='home'){go('chat')}const target=page;if(target==='chat'){state.messages.push({role:'user',text,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});busy=true;render();setTimeout(()=>{state.messages.push({role:'assistant',text:reply(text),time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});busy=false;save();render()},700)}else{const cost=target==='video'?25:12;if(state.tokens<cost){actions.topup();return}busy=true;render();setTimeout(()=>{state.tokens-=cost;const a=/девуш|портрет|аниме/i.test(text)?0:/город|неон/i.test(text)?2:/долин/i.test(text)?3:1;state.lastPrompt={...state.lastPrompt,[target]:text};state.history.unshift({asset:a,type:target,text,cost,date:new Date().toLocaleDateString('ru')});busy=false;save();if(page===target)selected=a;render();if(state.notifications)toast('Демопример готов и добавлен в историю')},1000)}}
const actions={settings:()=>go('settings'),notifications:()=>go('notifications'),back:()=>go(['themes','account','notifications','language','about'].includes(page)?'settings':'home'),close:()=>document.querySelector('#modal').close(),topup:()=>modal('Пополнить токены','<p>Демонстрационное пополнение. Без оплаты и банковских данных.</p><button class="primary" data-action="add-tokens">Добавить 1 000 токенов</button>'),'add-tokens':()=>{state.tokens+=1000;save();actions.close();render();toast('Добавлено 1 000 демотокенов')},'apply-theme':()=>{state.theme=draftTheme;save();render();toast('Тема применена')},like:()=>{state.likes=state.likes.includes(selected)?state.likes.filter(i=>i!==selected):[...state.likes,selected];save();render()},play:()=>{playing=!playing;renderStudio(document.querySelector('#screen'))},download:()=>{const a=document.createElement('a');a.href=assets[selected];a.download=`vero-${selected+1}.png`;a.click();toast(page==='video'?'Сохранён кадр демоанимации':'Изображение сохранено')},voice:()=>modal('Голосовой ввод','<p>В автономном макете микрофон не записывает звук. Можно вставить пример голосового запроса.</p><button class="primary" data-action="voice-demo">«Придумай идею для видео»</button>'),'voice-demo':()=>{actions.close();document.querySelector('#promptInput').value='Придумай идею для видео';document.querySelector('#promptInput').focus()},parameters:()=>modal('Параметры демо',`<form id="params"><label class="field">Стиль<select name="style"><option>Кинематографичный</option><option>Аниме</option><option>Пейзаж</option></select></label><label class="field">Формат<select name="ratio"><option>Альбомный</option><option>Квадратный</option><option>Портретный</option></select></label><p>Параметры меняют выбор примера и кадрирование превью.</p><button class="primary">Применить</button></form>`),menu:()=>{document.querySelector('#app').insertAdjacentHTML('beforeend',`<div class="drawer-overlay" id="drawer"><div class="drawer"><div class="brand">Vera.</ document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){actions['close-menu']();go(b.dataset.page)}else if(b.dataset.action){e.preventDefault();actions[b.dataset.action]?.()}else if(b.dataset.themeChoice){draftTheme=b.dataset.themeChoice;state.theme=draftTheme;save();document.body.dataset.theme=state.theme;render();toast('Тема применена')}else if(b.dataset.category){category=b.dataset.category;selected=category==='Аниме'||category==='Портреты'?0:category==='Креатив'?2:1;renderStudio(document.querySelector('#screen'))}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.select){selected=Number(b.dataset.select);playing=false;renderStudio(document.querySelector('#screen'))}else if(b.dataset.open){go(b.dataset.kind);selected=Number(b.dataset.open);render()}});

let swipeStart=null;document.addEventListener('touchstart',event=>{if((window.innerWidth||375)>750||event.touches.length!==1){swipeStart=null;return}const point=event.touches[0];swipeStart={x:point.clientX,y:point.clientY,target:event.target}},{passive:true,capture:true});document.addEventListener('touchend',event=>{if(!swipeStart||!event.changedTouches.length)return;const start=swipeStart,point=event.changedTouches[0];swipeStart=null;if(start.target.closest?.('input,textarea,select,dialog')||document.querySelector('#modal')?.open)return;const dx=point.clientX-start.x,dy=point.clientY-start.y;if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.25||Math.abs(dy)>95)return;if(dx>0){if(!document.querySelector('#drawer'))actions.menu()}else if(document.querySelector('#drawer'))actions['close-menu']()},{passive:true,capture:true});document.addEventListener('touchcancel',()=>swipeStart=null,{passive:true});

save=()=>{try{localStorage.setItem(VERO_STORE,JSON.stringify({theme:state.theme,name:state.name,tokens:state.tokens,likes:state.likes,library:state.library,chats:state.chats,currentChatId:state.currentChatId,currentStudio:state.currentStudio,activeMediaChat:state.activeMediaChat,generationSettings:state.generationSettings,plan:state.plan,planGrants:state.planGrants,ads:state.ads,productVersion:state.productVersion,notifications:state.notifications}))}catch{}};
save();
tokenbar=function(){return `<div class="tokenbar"><span class="tokenbar-balance">${icon('coin')}<span class="tokenbar-copy"><b>${state.tokens.toLocaleString('ru')} токенов</b><small>${planName()}</small></span></span><button class="pill" data-action="topup">+ Пополнить</button></div>`};
composer=function(placeholder){const kind=page==='image'||page==='video'?page:null,cost=kind?generationCost(kind):0,notEnough=kind&&state.tokens<cost;return `<form class="composer" id="composer"><input id="promptInput" autocomplete="off" aria-label="${placeholder}" placeholder="${placeholder}" maxlength="1200" required ${busy?'disabled':''}>${kind?`<span class="composer-cost ${notEnough?'insufficient':''}" id="composerCost" title="Стоимость с текущими параметрами">${icon('coin')}${cost}</span>`:''}<button class="iconbtn send" type="submit" aria-label="Отправить" ${busy?'disabled':''}>${icon('arrow')}</button></form>`};
const legacyRender=render;
function activeChat(){return state.chats.find(chat=>chat.id===state.currentChatId)||null}
function activeStudioItem(kind=page){return state.library.find(item=>item.id===state.currentStudio[kind])||null}
function chatTitle(text){const clean=text.replace(/\s+/g,' ').trim();return clean.length>38?clean.slice(0,38).trim()+'…':clean||'Новый чат'}
function orderedChats(){return [...state.chats].sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||((b.updatedAt||0)-(a.updatedAt||0)))}
nav=function(p){const navIcon=p==='profile'?'user':p==='history'?'image':p;return `<button class="navlink ${page===p?'active':''}" data-page="${p}">${icon(navIcon)}${labels[p]}</button>`};
allHistory=()=>state.library;
function chatRows(){const chats=orderedChats(),draft=page==='chat'&&!state.currentChatId?`<div class="chat-row draft-chat active"><button class="chat-open" data-new-chat title="Новый чат"><span class="chat-kind">${icon('chat')}</span><span class="chat-title-text">Новый чат</span></button></div>`:'';if(!chats.length)return draft||'<div class="no-chats">Здесь появятся ваши чаты</div>';return draft+chats.slice(0,showAllChats?undefined:10).map(chat=>{const kind=chat.kind||'chat',isActive=kind==='chat'?page==='chat'&&chat.id===state.currentChatId:page===kind&&state.activeMediaChat[kind]===chat.id;return `<div class="chat-row ${isActive?'active':''}"><button class="chat-open" data-chat-open="${chat.id}" title="${esc(chat.title)}"><span class="chat-kind">${icon(kind==='video'?'video':kind==='image'?'image':'chat')}</span><span class="chat-title-text">${esc(chat.title)}</span></button><button class="chat-mini ${chat.pinned?'pinned':''}" data-chat-command="pin" data-chat-id="${chat.id}" aria-label="${chat.pinned?'Открепить':'Закрепить'} чат">${icon('pin')}</button><button class="chat-mini" data-chat-command="menu" data-chat-id="${chat.id}" aria-label="Действия с чатом">${icon('more')}</button></div>`}).join('')}
function chatCountLabel(count){const last=count%10,teens=count%100;return teens>=11&&teens<=14?'чатов':last===1?'чат':last>=2&&last<=4?'чата':'чатов'}
function chatsAreaBody(){const count=state.chats.length-10,extra=count>0?`<button class="more-chats" data-more-chats aria-expanded="${showAllChats}">${showAllChats?'Свернуть':`Ещё ${count} ${chatCountLabel(count)}`}</button>`:'';return `<div class="chat-divider"></div><div class="side-chat-head"><strong>Чаты</strong><button class="new-chat" data-new-chat>${icon('plus')} Новый</button></div><div class="chat-list">${chatRows()}</div>${extra}`}
function chatsArea(){return `<div class="side-chat-area">${chatsAreaBody()}</div>`}
function syncOpenDrawerChats(){const area=document.querySelector('#drawer .side-chat-area');if(area)area.innerHTML=chatsAreaBody()}
function toggleAllChats(){showAllChats=!showAllChats;for(const selector of ['#drawer .side-chat-area','#sidebar .side-chat-area']){const area=document.querySelector(selector);if(area)area.innerHTML=chatsAreaBody()}}
function sidebarMarkup(){return `<div class="brand">Vera.</div><div class="tagline">Создавай. Общайся. Вдохновляйся.</div>${['home','chat','image','video','history'].map(nav).join('')}${chatsArea()}<div class="bottom">${nav('profile')}${nav('settings')}<div class="demo">Локально · без API</div></div>`}
function drawerMarkup(){return `<div class="drawer-overlay" id="drawer"><div class="drawer"><div class="brand">Vera.</div>${btn('close','close-menu','Закрыть меню','close')}${['home','chat','image','video','history'].map(nav).join('')}${chatsArea()}<div class="bottom">${nav('settings')}${nav('help')}${tokenbar()}</div></div></div>`}
function renderChat(){const screen=document.querySelector('#screen'),chat=activeChat(),messages=chat?.messages||[];screen.innerHTML=messages.length?`<div class="chat-log">${messages.map(message=>`<div class="message user">${esc(message.text)}<time>${message.time}</time></div>`).join('')}</div>`:`<div class="chat-empty"><div>${icon('chat')}<strong>Новый чат</strong><span>Напишите первое сообщение — оно станет названием чата.</span></div></div>`;if(messages.length)screen.scrollTop=screen.scrollHeight;const footer=document.querySelector('#footer');footer.insertAdjacentHTML('beforeend','<div class="offline-note">Сообщения сохраняются на этом устройстве. Ответы ИИ не подключены.</div>')}
gallery=function(items){return items.length?`<div class="gallery">${items.map(item=>`<article class="glass media-card"><button class="media-card-main" data-library-id="${item.id}"><img src="${assets[item.asset]}" alt="${esc(item.text)}"><div class="caption"><div class="caption-row"><span>${item.type==='video'?'Видео':'Изображение'}</span><small>◉ −${item.cost}</small></div><small>${esc(item.text)}</small><small>${item.date}</small></div></button><button class="favorite-button ${state.likes.includes(item.id)?'liked':''}" data-favorite-id="${item.id}" aria-label="${state.likes.includes(item.id)?'Убрать из избранного':'Добавить в избранное'}">${icon('heart')}</button></article>`).join('')}</div>`:`<div class="library-empty"><div>${icon('image')}<strong>Библиотека пуста</strong><span>Созданные фото и видео появятся здесь.</span></div></div>`};
function renderLibrary(){let items=state.library.filter(item=>filter==='Все'||filter==='Избранное'&&state.likes.includes(item.id)||filter==='Видео'&&item.type==='video'||filter==='Изображения'&&item.type==='image');document.querySelector('#screen').innerHTML=`<div class="chips">${['Все','Изображения','Видео','Избранное'].map(t=>`<button class="pill ${filter===t?'active':''}" data-filter="${t}">${t}</button>`).join('')}</div>${gallery(items)}`}
function modelTitle(kind,id){return MODEL_OPTIONS[kind].find(model=>model[0]===id)?.[1]||id}
function renderPricing(){const current=state.plan||'free';const planCard=(id,title,price,tokens,features,featured=false)=>`<article class="glass price-card ${featured?'featured':''} ${current===id?'current':''}"><h3>${title}</h3><div class="price">${price}</div><ul>${features.map(text=>`<li>✓ ${text}</li>`).join('')}</ul><button data-subscribe="${id}" ${current===id?'disabled':''}>${current===id?'Текущий тариф':'Выбрать'}</button></article>`;document.querySelector('#screen').innerHTML=`<section class="glass pricing-hero"><div class="pricing-balance"><div><small>Баланс</small><b>${state.tokens.toLocaleString('ru')} токенов</b></div><span class="plan-badge">${planName()}</span></div></section><section class="pricing-section"><h3>Получить бесплатно</h3><div class="glass reward-card"><span>${icon('play')}</span><span class="reward-copy"><b>Посмотреть рекламу</b><small>+1 токен за просмотр</small></span><button data-action="watch-ad">Смотреть</button></div></section><section class="pricing-section"><h3>Подписка</h3><div class="pricing-grid">${planCard('free','Free','0 ₽',50,['50 стартовых токенов','Базовые модели'])}${planCard('pro','Pro','499 ₽ / мес',500,['500 токенов ежемесячно','Vera Pro','HD и 1080p'],true)}${planCard('studio','Studio','999 ₽ / мес',1500,['1 500 токенов','Vera Cinema','Ultra и 4K'])}</div></section><section class="pricing-section"><h3>Пакеты токенов</h3><div class="pricing-grid">${[[100,'149 ₽'],[500,'599 ₽'],[1000,'999 ₽']].map(([amount,price])=>`<article class="glass price-card"><h3>${amount} токенов</h3><div class="price">${price}</div><ul><li>Разовое пополнение</li><li>Без срока действия</li></ul><button data-buy-pack="${amount}">Выбрать</button></article>`).join('')}</div></section><section class="pricing-section"><h3>Своё количество</h3><form class="custom-tokens" id="custom-tokens"><input type="number" name="amount" min="10" max="10000" step="10" value="100" aria-label="Количество токенов"><button>Рассчитать</button></form><div class="payment-note">Платёжная система пока не подключена. Покупки и подписки работают как демонстрация продукта.</div></section>`}
function advancedParamsMarkup(kind){const settings=state.generationSettings[kind],isVideo=kind==='video',cost=generationCost(kind,settings);return `<form id="advanced-params" data-kind="${kind}"><div class="param-grid"><label class="field">Модель<select name="model">${optionList(MODEL_OPTIONS[kind],settings.model)}</select></label><label class="field">Качество<select name="quality">${optionList(isVideo?[["720","720p"],["1080","1080p"],["4k","4K"]]:[["standard","Стандарт"],["hd","HD"],["ultra","Ultra"]],settings.quality)}</select></label>${isVideo?`<label class="field">Длительность<select name="duration">${optionList([["5","5 секунд"],["7","7 секунд"]],settings.duration)}</select></label>`:`<label class="field">Количество<select name="count">${optionList([["1","1 изображение"],["2","2 изображения"],["4","4 изображения"]],settings.count)}</select></label>`}<label class="field">Формат<select name="ratio">${optionList([["landscape","Альбомный 16:9"],["square","Квадратный 1:1"],["portrait","Портретный 9:16"]],settings.ratio)}</select></label><label class="field">Стиль<select name="style">${optionList([["cinema","Кинематографичный"],["anime","Аниме"],["realism","Реализм"],["art","Иллюстрация"]],settings.style)}</select></label></div><div class="param-cost"><span>Стоимость генерации</span><b id="paramCost">${cost} токенов</b></div><p class="param-note">Модель, качество, длительность и количество напрямую влияют на стоимость.</p><button class="primary">Применить параметры</button></form>`}
function readAdvancedParams(form){const data=new FormData(form),kind=form.dataset.kind,settings={model:data.get('model'),quality:data.get('quality'),ratio:data.get('ratio'),style:data.get('style')};if(kind==='video')settings.duration=Number(data.get('duration'));else settings.count=Number(data.get('count'));return {kind,settings}}
renderStudio=function(el){const isVideo=page==='video',kind=page,item=activeStudioItem(kind),settings=state.generationSettings[kind],estimate=generationCost(kind,settings),cats=isVideo?['Все','Клипы','Короткие','Креатив']:['Все','Пейзажи','Портреты','Аниме'],activeId=state.activeMediaChat[kind],recent=activeId?state.library.filter(entry=>entry.type===kind&&entry.chatId===activeId).slice(0,4):item?[item]:[];if(item)selected=item.asset;const loader=`<div class="generation-loader ${isVideo?'is-video':'is-image'}"><div class="loader-visual"><div class="loader-orbit"></div>${icon(isVideo?'video':'image')}<i class="loader-scan"></i></div><strong>${isVideo?'Создаём видео':'Создаём изображение'}…</strong><span>Результат появится в этом чате и в библиотеке.</span><div class="loader-progress"><i></i></div><div class="loader-dots"><b></b><b></b><b></b></div></div>`;el.innerHTML=`<div class="chips">${cats.map(t=>`<button class="pill ${category===t?'active':''}" data-category="${t}">${t}</button>`).join('')}</div><div class="glass prompt"><p>${item?esc(item.text):isVideo?'Опишите видео, которое хотите создать':'Опишите изображение, которое хотите создать'}</p>${btn('tune','parameters','Расширенные параметры')}</div><div class="generation-summary"><span>${modelTitle(kind,settings.model)} · ${settings.quality.toUpperCase()}${isVideo?` · ${settings.duration} сек.`:` · ${settings.count} шт.`}</span><strong>◉ ${estimate}</strong></div>${busy&&generatingKind===kind?loader:item?`<div class="preview ${isVideo?'video':''} ${playing?'playing':''}"><img src="${assets[item.asset]}" alt="${esc(item.text)}"><span class="demolabel">${isVideo?'Демоанимация':'Демопример'}</span>${isVideo?`<button class="play" data-action="play" aria-label="${playing?'Пауза':'Воспроизвести'}">${icon(playing?'pause':'play')}</button><span class="duration">${item.settings?.duration||5} сек.</span>`:''}</div><div class="actions"><span class="cost">◉ · ${item.cost} токенов</span>${btn('download','download',isVideo?'Скачать кадр':'Скачать изображение')}${btn('heart','like',state.likes.includes(item.id)?'Убрать из избранного':'Добавить в избранное',state.likes.includes(item.id)?'liked':'')}</div>`:`<div class="studio-empty"><div>${icon(isVideo?'video':'image')}<strong>Новая генерация</strong><span>Введите запрос — здесь не показываются результаты из других чатов.</span></div></div>`}${recent.length?`<div class="thumbs">${recent.map(entry=>`<button class="thumb ${item?.id===entry.id?'selected':''}" data-library-preview="${entry.id}" aria-label="${esc(entry.text)}"><img src="${assets[entry.asset]}" alt="${esc(entry.text)}"></button>`).join('')}</div>`:''}`};
go=function(p){if(!labels[p])p='home';if(p==='chat'&&!openingChat){state.currentChatId=null;save()}if((p==='image'||p==='video')&&!openingMedia){state.activeMediaChat[p]=null;state.currentStudio[p]=null;save()}openingMedia=false;openingChat=false;playing=false;page=p;category='Все';location.hash=p;render()};
render=function(){const chat=activeChat(),mediaChat=(page==='image'||page==='video')?state.chats.find(item=>item.id===state.activeMediaChat[page]):null;state.messages=chat?.messages||[];document.body.dataset.theme=state.theme;legacyRender();document.querySelector('#sidebar').innerHTML=sidebarMarkup();const topbar=document.querySelector('#topbar'),nested=['themes','account','notifications','language','about'];if(page==='home')topbar.innerHTML=`<span class="demo" style="flex:1">Твоё пространство идей</span>${btn('menu','menu','Открыть меню','mobile-menu')}${btn('settings','settings','Настройки')}`;else if(nested.includes(page))topbar.innerHTML=`${btn('back','back','Назад')}<h2>${labels[page]}</h2>${btn('settings','settings','Настройки')}`;else topbar.innerHTML=`${btn('menu','menu','Открыть меню','mobile-menu')}<h2>${page==='chat'?(chat?esc(chat.title):'Новый чат'):mediaChat?esc(mediaChat.title):labels[page]}</h2>${page==='chat'?btn('plus','new-chat','Новый чат'):btn(page==='profile'?'bell':'settings',page==='profile'?'notifications':'settings',page==='profile'?'Уведомления':'Настройки')}`;document.querySelector('#bottom').innerHTML=['home','history','profile'].map(p=>`<button data-page="${p}" class="${page===p?'active':''}">${icon(p==='profile'?'user':p==='history'?'image':p)}${labels[p]}</button>`).join('');if(page==='chat')renderChat();if(page==='history')renderLibrary();if(page==='pricing')renderPricing();if(page==='profile'){const balance=document.querySelector('.balance');if(balance)balance.insertAdjacentHTML('afterbegin',`<div class="row" style="margin-bottom:12px"><span>Тариф</span><button class="pill" data-page="pricing">${planName()} ›</button></div>`)}};
submit=async function(text){if(busy)return;if(page==='home')go('chat');const target=page,time=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});if(target==='chat'){let chat=activeChat();if(!chat){chat={id:'c'+Date.now(),kind:'chat',title:chatTitle(text),messages:[],pinned:false,createdAt:Date.now(),updatedAt:Date.now()};state.chats.unshift(chat);state.currentChatId=chat.id}chat.messages.push({role:'user',text,time});chat.updatedAt=Date.now();save();render();toast('Сообщение сохранено');return}if(target!=='image'&&target!=='video')return;const settings={...state.generationSettings[target]},cost=generationCost(target,settings);if(state.tokens<cost){toast(`Нужно ${cost} токенов — на балансе ${state.tokens}`);actions.topup();return}let mediaChat=state.chats.find(chat=>chat.id===state.activeMediaChat[target]&&chat.kind===target);if(!mediaChat){mediaChat={id:'c'+Date.now(),kind:target,title:chatTitle(text),messages:[],pinned:false,createdAt:Date.now(),updatedAt:Date.now()};state.chats.unshift(mediaChat);state.activeMediaChat[target]=mediaChat.id}mediaChat.messages.push({role:'user',text,time});mediaChat.updatedAt=Date.now();busy=true;generatingKind=target;save();render();setTimeout(()=>{const baseAsset=/девуш|портрет|аниме/i.test(text)?0:/город|неон/i.test(text)?2:/долин|лес/i.test(text)?3:1,count=target==='image'?settings.count:1,created=[];for(let index=0;index<count;index++){created.push({id:'m'+Date.now()+'-'+index,chatId:mediaChat.id,asset:(baseAsset+index)%4,type:target,text,cost:Math.ceil(cost/count),settings:{...settings},date:new Date().toLocaleDateString('ru')})}state.tokens-=cost;state.library.unshift(...created);state.currentStudio[target]=created[0].id;busy=false;generatingKind=null;save();if(page===target)render();if(state.notifications)toast(`Готово · списано ${cost} токенов`)},900)};
let drawerCloseTimer=null;actions.menu=()=>{const existing=document.querySelector('#drawer');if(existing){clearTimeout(drawerCloseTimer);(window.requestAnimationFrame||((fn)=>setTimeout(fn,0)))(()=>existing.classList.add('open'));return}document.querySelector('#app').insertAdjacentHTML('beforeend',drawerMarkup());(window.requestAnimationFrame||((fn)=>setTimeout(fn,0)))(()=>document.querySelector('#drawer')?.classList.add('open'))};
actions['close-menu']=()=>{const drawer=document.querySelector('#drawer');if(!drawer)return;drawer.classList.remove('open');clearTimeout(drawerCloseTimer);drawerCloseTimer=setTimeout(()=>drawer.remove(),300)};
actions['new-chat']=()=>startNewChat();
actions.topup=()=>{actions['close-menu']();go('pricing')};
actions.parameters=()=>modal('Расширенные параметры',advancedParamsMarkup(page));
delete actions.voice;delete actions['voice-demo'];
actions['watch-ad']=()=>modal('Реклама за токены',`<div class="ad-demo"><div class="ad-mark">Vera Ads</div><p>Демонстрационный рекламный блок. После просмотра начисляется 1 токен.</p><button class="primary" data-action="claim-ad">Получить 1 токен</button></div>`);
actions['claim-ad']=()=>{state.tokens+=1;save();actions.close();render();toast('Начислен 1 токен')};
actions.like=()=>{const item=activeStudioItem();if(!item)return;toggleFavorite(item.id);render()};
actions.download=()=>{const item=activeStudioItem();if(!item)return;const link=document.createElement('a');link.href=assets[item.asset];link.download=`vero-${item.type}-${item.id}.png`;link.click();toast(item.type==='video'?'Кадр сохранён':'Изображение сохранено')};
function toggleFavorite(id){if(!state.library.some(item=>item.id===id))return;state.likes=state.likes.includes(id)?state.likes.filter(itemId=>itemId!==id):[...state.likes,id];save();toast(state.likes.includes(id)?'Добавлено в избранное':'Удалено из избранного')}
function packPrice(amount){return Math.max(49,Math.ceil(Number(amount)*.99))}
function openPack(amount){amount=Math.max(10,Math.min(10000,Number(amount)||0));modal(`${amount.toLocaleString('ru')} токенов`,`<p>Стоимость: <b>${packPrice(amount).toLocaleString('ru')} ₽</b></p><p>Платёжная система пока не подключена. Для проверки макета можно выполнить демопокупку.</p><button class="primary" data-confirm-pack="${amount}">Начислить в деморежиме</button>`)}
function confirmPack(amount){state.tokens+=Number(amount);save();actions.close();render();toast(`Начислено ${Number(amount).toLocaleString('ru')} токенов`)}
function openPlan(id){const plan=PLAN_INFO[id];if(!plan)return;modal(`Тариф ${plan.name}`,`<p>${id==='free'?'Бесплатный тариф без ежемесячного пополнения.':`${plan.tokens.toLocaleString('ru')} токенов включено ежемесячно.`}</p><p>Оплата пока не подключена. Можно активировать тариф для демонстрации.</p><button class="primary" data-activate-plan="${id}">${id==='free'?'Перейти на Free':'Активировать демо'}</button>`)}
function activatePlan(id){const plan=PLAN_INFO[id];if(!plan)return;if(id!=='free'&&!state.planGrants.includes(id)){state.tokens+=plan.tokens;state.planGrants.push(id)}state.plan=id;save();actions.close();render();toast(`Тариф ${plan.name} активирован`)}
function startNewChat(){state.currentChatId=null;state.messages=[];save();actions['close-menu']();go('chat');setTimeout(()=>document.querySelector('#promptInput')?.focus(),0)}
function openChat(id){const chat=state.chats.find(item=>item.id===id);if(!chat)return;const kind=chat.kind||'chat';actions['close-menu']();if(kind==='image'||kind==='video'){state.activeMediaChat[kind]=chat.id;const latest=state.library.find(item=>item.chatId===chat.id&&item.type===kind);state.currentStudio[kind]=latest?.id||null;openingMedia=true;save();go(kind);return}state.currentChatId=id;openingChat=true;save();go('chat')}
function togglePin(id){const chat=state.chats.find(item=>item.id===id);if(!chat)return;chat.pinned=!chat.pinned;chat.updatedAt=Date.now();save();render();syncOpenDrawerChats();toast(chat.pinned?'Чат закреплён':'Чат откреплён')}
function chatMenu(id){const chat=state.chats.find(item=>item.id===id);if(!chat)return;modal('Управление чатом',`<form id="rename-chat" data-chat-id="${chat.id}"><label class="field">Название<input name="title" value="${esc(chat.title)}" maxlength="60" required></label><button class="primary">Сохранить название</button></form><div class="dialog-actions"><button class="pill" data-chat-command="pin" data-chat-id="${chat.id}">${icon('pin')} ${chat.pinned?'Открепить':'Закрепить'}</button><button class="pill danger" data-chat-command="ask-delete" data-chat-id="${chat.id}">${icon('trash')} Удалить чат</button></div>`)}
function askDelete(id){const chat=state.chats.find(item=>item.id===id);if(!chat)return;modal('Удалить чат?',`<p>«${esc(chat.title)}» будет удалён только с этого устройства.</p><div class="dialog-actions"><button class="primary danger" data-chat-command="delete" data-chat-id="${chat.id}">Удалить</button><button class="pill" data-action="close">Отмена</button></div>`)}
function deleteChat(id){const chat=state.chats.find(item=>item.id===id),kind=chat?.kind||'chat';state.chats=state.chats.filter(item=>item.id!==id);if(state.currentChatId===id)state.currentChatId=null;if((kind==='image'||kind==='video')&&state.activeMediaChat[kind]===id){state.activeMediaChat[kind]=null;state.currentStudio[kind]=null}save();actions.close();render();syncOpenDrawerChats();toast('Чат удалён')}
function renameChat(id,title){const chat=state.chats.find(item=>item.id===id),clean=title.trim();if(!chat||!clean)return false;chat.title=clean;chat.updatedAt=Date.now();save();render();syncOpenDrawerChats();return true}
document.addEventListener('click',event=>{const open=event.target.closest('[data-chat-open]');if(open){event.preventDefault();openChat(open.dataset.chatOpen);return}const fresh=event.target.closest('[data-new-chat]');if(fresh){event.preventDefault();startNewChat();return}const more=event.target.closest('[data-more-chats]');if(more){event.preventDefault();toggleAllChats();return}const command=event.target.closest('[data-chat-command]');if(command){event.preventDefault();const id=command.dataset.chatId,type=command.dataset.chatCommand;if(type==='pin'){actions.close();togglePin(id)}if(type==='menu')chatMenu(id);if(type==='ask-delete')askDelete(id);if(type==='delete')deleteChat(id);return}const card=event.target.closest('[data-library-id]');if(card){event.preventDefault();const item=state.library.find(entry=>entry.id===card.dataset.libraryId);if(item){state.activeMediaChat[item.type]=item.chatId||null;state.currentStudio[item.type]=item.id;openingMedia=true;save();go(item.type)}return}const preview=event.target.closest('[data-library-preview]');if(preview){event.preventDefault();const item=state.library.find(entry=>entry.id===preview.dataset.libraryPreview);if(item){state.currentStudio[item.type]=item.id;playing=false;save();renderStudio(document.querySelector('#screen'))}}},true);
document.addEventListener('submit',event=>{if(event.target.id!=='rename-chat')return;event.preventDefault();const title=new FormData(event.target).get('title');if(!renameChat(event.target.dataset.chatId,title))return;actions.close();toast('Чат переименован')});
document.addEventListener('click',event=>{const favorite=event.target.closest('[data-favorite-id]');if(favorite){event.preventDefault();event.stopPropagation();toggleFavorite(favorite.dataset.favoriteId);render();return}const pack=event.target.closest('[data-buy-pack]');if(pack){event.preventDefault();openPack(pack.dataset.buyPack);return}const confirm=event.target.closest('[data-confirm-pack]');if(confirm){event.preventDefault();confirmPack(confirm.dataset.confirmPack);return}const subscribe=event.target.closest('[data-subscribe]');if(subscribe){event.preventDefault();openPlan(subscribe.dataset.subscribe);return}const activate=event.target.closest('[data-activate-plan]');if(activate){event.preventDefault();activatePlan(activate.dataset.activatePlan)}},true);
document.addEventListener('change',event=>{const form=event.target.closest?.('#advanced-params');if(!form)return;const {kind,settings}=readAdvancedParams(form),cost=document.querySelector('#paramCost');if(cost)cost.textContent=`${generationCost(kind,settings)} токенов`});
document.addEventListener('submit',event=>{if(event.target.id==='advanced-params'){event.preventDefault();const {kind,settings}=readAdvancedParams(event.target);state.generationSettings[kind]=settings;save();actions.close();render();toast(`Параметры сохранены · ${generationCost(kind)} токенов`)}if(event.target.id==='custom-tokens'){event.preventDefault();const amount=Number(new FormData(event.target).get('amount'));if(amount>=10&&amount<=10000)openPack(amount);else toast('Введите количество от 10 до 10 000')}});
</script><script>
(() => {
  const tg = window.Telegram?.WebApp;
  if (!tg || !tg.initData) return;
  document.documentElement.classList.add('telegram-mini');
  function syncViewport() {
    const height = tg.viewportStableHeight || tg.viewportHeight;
    if (height > 0) document.documentElement.style.setProperty('--tg-viewport-height', height + 'px');
    document.documentElement.style.setProperty('--tg-safe-bottom', (tg.contentSafeAreaInset?.bottom || 0) + 'px');
  }
  function syncChrome() {
    const bg = getComputedStyle(document.body).getPropertyValue('--bg').trim();
    if (/^#[0-9a-fA-F]{6}$/.test(bg)) {
      try { tg.setBackgroundColor(bg); tg.setHeaderColor(bg); } catch (_) {}
    }
    if (tg.BackButton) {
      if (typeof page !== 'undefined' && page !== 'home') tg.BackButton.show();
      else tg.BackButton.hide();
    }
  }
  tg.BackButton?.onClick(() => {
    if (document.querySelector('#modal')?.open) actions.close();
    else if (document.querySelector('#drawer')) actions['close-menu']();
    else actions.back();
  });
  tg.onEvent?.('viewportChanged', syncViewport);
  tg.onEvent?.('contentSafeAreaChanged', syncViewport);
  window.addEventListener('hashchange', syncChrome);
  new MutationObserver(syncChrome).observe(document.body, {attributes:true,attributeFilter:['data-theme']});
  tg.ready();
  tg.expand();
  syncViewport();
  syncChrome();
})();
</script></body></html>
